<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Account')}"></head>

<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="eco-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="stat-icon green mx-auto mb-2">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Join EcoSort AI</h3>
                    <p class="text-secondary small">Start tracking waste segregation and earn EcoPoints</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <!-- Google Sign Up Option -->
                <div class="mb-3">
                    <a th:href="@{/oauth2/google}" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center gap-2 shadow-sm bg-white fw-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        <span>Sign up with Google</span>
                    </a>
                </div>

                <div class="position-relative my-4 text-center">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small fw-semibold" style="letter-spacing: 0.05em;">OR REGISTER WITH EMAIL</span>
                </div>

                <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Username</label>
                        <input type="text" id="username" th:field="*{username}" class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                               placeholder="Choose a display username" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="name@example.com" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="At least 6 characters" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="ward" class="form-label small fw-semibold">Municipal Ward / Locality</label>
                        <select id="ward" th:field="*{ward}" class="form-select">
                            <option value="Ward 12 - Green Valley">Ward 12 - Green Valley</option>
                            <option value="Ward 5 - Eco District">Ward 5 - Eco District</option>
                            <option value="Ward 8 - North Park">Ward 8 - North Park</option>
                            <option value="Ward 3 - Riverside">Ward 3 - Riverside</option>
                            <option value="Ward 1 - Central Zone">Ward 1 - Central Zone</option>
                        </select>
                        <div class="form-text small">Used to calculate community ward rankings without exposing exact address.</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        Create Citizen Account
                    </button>
                </form>

                <div class="text-center small text-secondary">
                    Already registered? <a th:href="@{/login}" class="text-success fw-bold">Sign In here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
