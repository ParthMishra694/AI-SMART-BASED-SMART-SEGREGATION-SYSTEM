<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Citizen Profile & Settings')}"></head>

<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="fw-bold text-dark mb-1">
                <i class="bi bi-person-gear text-success me-2"></i> Profile & Location Settings
            </h2>
            <p class="text-secondary small mb-4">
                Manage your citizen profile and location for community leaderboards.
            </p>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="eco-card p-4 bg-white shadow-sm mb-4">
                <h5 class="fw-bold text-dark mb-3">Account Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Username (Publicly Displayed)</label>
                        <input type="text" class="form-control" th:value="${currentUser.username}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Email (Private)</label>
                        <input type="text" class="form-control" th:value="${currentUser.email}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Lifetime EcoPoints</label>
                        <input type="text" class="form-control fw-bold text-success" th:value="${currentUser.totalEcoPoints} + ' pts'" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">Current Daily Streak</label>
                        <input type="text" class="form-control fw-bold text-warning" th:value="${currentUser.streakDays} + ' Days'" readonly>
                    </div>
                </div>

                <!-- Current Location Display -->
                <div class="p-3 bg-light rounded-3 border mb-4" th:if="${currentUser.locationSetupComplete}">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <i class="bi bi-geo-alt-fill text-danger"></i>
                        <span class="fw-bold text-dark">Current Location</span>
                    </div>
                    <span class="text-success fw-semibold" th:text="${currentUser.locationDisplay}">Location</span>
                </div>

                <hr class="my-4">

                <h5 class="fw-bold text-dark mb-2">
                    <i class="bi bi-geo-alt me-1"></i> Update Your Location
                </h5>
                <p class="text-secondary small mb-3">
                    Changing your location updates which community leaderboard you are ranked in.
                </p>

                <form th:action="@{/profile/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="country" class="form-label small fw-semibold">Country</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-globe-americas"></i></span>
                                <input type="text" id="country" name="country" class="form-control"
                                       th:value="${currentUser.country}" placeholder="e.g. India" required
                                       list="countryList" autocomplete="off">
                            </div>
                            <datalist id="countryList">
                                <option value="India"><option value="United States"><option value="United Kingdom">
                                <option value="Canada"><option value="Australia"><option value="Germany">
                                <option value="Japan"><option value="Brazil"><option value="South Africa">
                            </datalist>
                        </div>
                        <div class="col-md-4">
                            <label for="state" class="form-label small fw-semibold">State / Province</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-map"></i></span>
                                <input type="text" id="state" name="state" class="form-control"
                                       th:value="${currentUser.state}" placeholder="e.g. Madhya Pradesh" required
                                       list="stateList" autocomplete="off">
                            </div>
                            <datalist id="stateList">
                                <option value="Andhra Pradesh"><option value="Bihar"><option value="Delhi">
                                <option value="Gujarat"><option value="Karnataka"><option value="Kerala">
                                <option value="Madhya Pradesh"><option value="Maharashtra"><option value="Punjab">
                                <option value="Rajasthan"><option value="Tamil Nadu"><option value="Telangana">
                                <option value="Uttar Pradesh"><option value="West Bengal">
                            </datalist>
                        </div>
                        <div class="col-md-4">
                            <label for="city" class="form-label small fw-semibold">City</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                                <input type="text" id="city" name="city" class="form-control"
                                       th:value="${currentUser.city}" placeholder="e.g. Bhopal" required
                                       list="cityList" autocomplete="off">
                            </div>
                            <datalist id="cityList">
                                <option value="Mumbai"><option value="Delhi"><option value="Bangalore">
                                <option value="Hyderabad"><option value="Chennai"><option value="Kolkata">
                                <option value="Pune"><option value="Ahmedabad"><option value="Jaipur">
                                <option value="Bhopal"><option value="Indore"><option value="Lucknow">
                                <option value="Surat"><option value="Nagpur"><option value="Patna">
                            </datalist>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2 me-1"></i> Save Location
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
