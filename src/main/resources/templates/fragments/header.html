<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | EcoSort AI' : 'EcoSort AI — Agentic Waste Management & Green Rewards'}">EcoSort AI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css(v=blue)}">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-recycle text-success fs-3"></i>
            <span>EcoSort<span class="text-success">AI</span></span>
            <span class="sdg-badge ms-2" title="UN SDG 12: Responsible Consumption and Production">
                <i class="bi bi-globe-americas"></i> SDG 12
            </span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-primary fw-bold" th:href="@{/scan}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-camera me-1"></i> AI Scanner
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/history}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-clock-history me-1"></i> History
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leaderboard}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-trophy me-1"></i> Leaderboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/challenges}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-flag me-1"></i> Challenges
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/quiz}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-patch-question me-1"></i> SDG Quiz
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/recycling}" sec:authorize="isAuthenticated()">
                        <i class="bi bi-box-seam me-1"></i> Verify Drop-off
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/rewards}">
                        <i class="bi bi-gift me-1"></i> Green Rewards
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-danger fw-bold" th:href="@{/admin}">
                        <i class="bi bi-shield-lock me-1"></i> Admin
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- If Authenticated -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="btn btn-sm btn-outline-success dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <img th:if="${session.googleProfilePic != null}" th:src="${session.googleProfilePic}" alt="Avatar" class="rounded-circle" width="22" height="22" style="object-fit: cover;">
                        <i th:unless="${session.googleProfilePic != null}" class="bi bi-person-circle"></i>
                        <span class="badge bg-success rounded-pill" th:text="${currentUser != null ? currentUser.totalEcoPoints : 0} + ' pts'">0 pts</span>
                        <span class="fw-semibold" th:text="${currentUser != null ? currentUser.username : #authentication.name}">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><a class="dropdown-item" th:href="@{/ecopoints}"><i class="bi bi-coin text-warning me-2"></i> EcoPoints Ledger</a></li>
                        <li><a class="dropdown-item" th:href="@{/recommendations}"><i class="bi bi-stars text-primary me-2"></i> AI Recommendations</a></li>
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-gear text-secondary me-2"></i> Profile & Locality</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100 text-start">
                                    <i class="bi bi-box-arrow-right me-2"></i> Log Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- If Anonymous -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-sm btn-outline-primary">Log In</a>
                    <a th:href="@{/register}" class="btn btn-sm btn-primary">Join EcoSort</a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
