spring.application.name=wastewise-ai

# Server Port (Render sets PORT; default 8080 locally)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Configuration
# Defaults to H2 in PostgreSQL compatibility mode for instant zero-config local run,
# or seamlessly connects to Supabase PostgreSQL when environment variables are supplied.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/wastewisedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
# Keep each Render instance's Supabase session-pooler usage small, especially during deploys.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 Console (available locally when using H2)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Multipart File Upload Limits for Waste Photos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# AI / Gemini API Configuration
wastewise.ai.gemini.api-key=${GEMINI_API_KEY:}
wastewise.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
wastewise.ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# Google OAuth2 Configuration
# Put real values in ./application-local.properties (gitignored) or as env vars.
# Empty / placeholder IDs make Google return Error 401: invalid_client.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# EcoPoints Configuration
wastewise.points.waste-analysis=2
wastewise.points.daily-analysis-limit=10
wastewise.points.quiz-completion=5
wastewise.points.verified-recycling=15
wastewise.points.weekly-challenge=25
wastewise.points.streak-bonus=10

# Security session timeout
server.servlet.session.timeout=60m

# Import optional local configuration/secrets if available (ignored by git)
spring.config.import=optional:file:./application-local.properties,optional:file:.env[.properties]
